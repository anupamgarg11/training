<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sessions · Anupam</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🏋️%3C/text%3E%3C/svg%3E">
<style>
 :root{--ground:#F6F7F5;--surface:#FFF;--surface-2:#EFF1EE;--ink:#15181A;--ink-2:#4A5350;--ink-3:#7C8683;
  --rule:#DCE1DE;--rule-2:#C7CFCB;--easy:#2E7D6E;--easy-bg:#E4F0ED;--hard:#C2542B;--hard-bg:#F8E8E1;
  --iron:#3F5487;--iron-bg:#E5EAF3;
  --fd:ui-sans-serif,-apple-system,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --fb:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --fm:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;}
 @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F1214;--surface:#161A1C;--surface-2:#1D2224;--ink:#E9EDEA;--ink-2:#A3ADAA;--ink-3:#78827F;
  --rule:#262C2E;--rule-2:#333A3C;--easy:#4FB49F;--easy-bg:#132A26;--hard:#E8794A;--hard-bg:#2E1913;
  --iron:#7C97D4;--iron-bg:#161D2C;}}
 :root[data-theme="dark"]{--ground:#0F1214;--surface:#161A1C;--surface-2:#1D2224;--ink:#E9EDEA;
  --ink-2:#A3ADAA;--ink-3:#78827F;--rule:#262C2E;--rule-2:#333A3C;--easy:#4FB49F;--easy-bg:#132A26;
  --hard:#E8794A;--hard-bg:#2E1913;--iron:#7C97D4;--iron-bg:#161D2C;}
 *{box-sizing:border-box}
 body{background:var(--ground);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;margin:0;padding:0 18px 80px;-webkit-font-smoothing:antialiased}
 .wrap{max-width:1000px;margin:0 auto}
 h1,h2,h4,table,.label{font-family:var(--fd)}
 h1{font-size:clamp(2rem,5.5vw,3rem);line-height:1.03;letter-spacing:-.033em;font-weight:700;margin:0}
 h2{font-size:1.05rem;letter-spacing:-.012em;font-weight:700;margin:0}
 .label{font-family:var(--fm);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
 header{padding:52px 0 0}.rule-heavy{height:3px;background:var(--ink);margin:18px 0 0}
 .sitenav{position:sticky;top:0;z-index:50;display:flex;gap:2px;padding:8px 0;background:var(--ground);
   border-bottom:1px solid var(--rule-2);font-family:var(--fd);flex-wrap:wrap}
 .sitenav a{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink-3);
   text-decoration:none;padding:6px 11px;border-radius:2px}
 .sitenav a:hover,.sitenav a.on{color:var(--ink);background:var(--surface-2)}
 section{padding-top:32px}
 .sh{display:flex;align-items:baseline;gap:12px;border-top:1px solid var(--rule-2);padding-top:12px;margin-bottom:12px}
 .cnt{font-family:var(--fm);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-left:auto}
 .tw{overflow-x:auto;border:1px solid var(--rule);background:var(--surface)}
 table{border-collapse:collapse;width:100%;font-size:.84rem}
 th{font-family:var(--fm);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
   font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule-2);background:var(--surface-2);white-space:nowrap}
 td{padding:9px 10px;border-bottom:1px solid var(--rule);color:var(--ink-2);vertical-align:top}
 tbody tr:last-child td{border-bottom:none}
 tr.aux{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
 td.pr{font-family:var(--fm);font-size:.56rem;letter-spacing:.09em;font-weight:600;width:42px;white-space:nowrap}
 tr.core td.pr{color:var(--hard)} tr.aux td.pr{color:var(--ink-3)}
 td.ex{color:var(--ink);font-weight:600;font-family:var(--fd);min-width:190px}
 td.sr{font-family:var(--fm);white-space:nowrap;font-size:.78rem}
 td.ld{font-family:var(--fm);color:var(--ink);font-weight:600;white-space:nowrap;font-size:.8rem}
 td.cu{font-size:.76rem;color:var(--ink-3);min-width:170px}
 td.la{font-family:var(--fm);font-size:.72rem;color:var(--ink-2);white-space:nowrap}
 tr.new{background:color-mix(in srgb,var(--hard-bg) 55%,transparent)}
 tr.new td.pr{color:var(--hard);font-weight:700}
 tr.new td.ex{color:var(--hard)}
 .status{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:26px}
 .st{background:var(--surface);border:1px solid var(--rule);padding:18px 20px}
 .st.good{border-left:3px solid var(--easy)} .st.bad{border-left:3px solid var(--hard)}
 .st h3{margin:0 0 9px;font-size:.95rem;font-family:var(--fd)}
 .st.good h3{color:var(--easy)} .st.bad h3{color:var(--hard)}
 .st ul{margin:0;padding-left:17px;font-size:.84rem;color:var(--ink-2)}
 .st li{margin-bottom:6px} .st li:last-child{margin-bottom:0}
 .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:26px}
 .rl{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--iron);padding:15px 17px}
 .rl h4{margin:0 0 5px;font-size:.86rem}
 .rl p{margin:0;font-size:.84rem;color:var(--ink-2)}
 footer{margin-top:44px;padding-top:16px;border-top:3px solid var(--ink);font-family:var(--fm);font-size:.68rem;letter-spacing:.05em;color:var(--ink-3)}
 @media(max-width:640px){body{padding:0 13px 60px}header{padding-top:36px}}
</style>
</head>
<body>
<div class="wrap">
<nav class="sitenav">
 <a href="index.html">Home</a><a href="calendar.html">119 Days</a><a href="sessions.html" class="on">Sessions</a><a href="progress.html">Progress</a><a href="kitchen.html">Kitchen</a><a href="plan.html">The Plan</a>
</nav>
<header>
  <div class="label">Current loads &middot; updated <!--STAMP--></div>
  <div class="rule-heavy"></div>
  <h1 style="margin-top:18px;">The three sessions</h1>
</header>
<div class="status">
  <div class="st good"><h3>What's working</h3><ul><!--WORKING--></ul></div>
  <div class="st bad"><h3>What needs fixing</h3><ul><!--FIXING--></ul></div>
</div>
<!--SECTIONS-->
<div class="rules"><!--RULES--></div>
<footer>This page is the single source of truth for loads. If it disagrees with anything else, this wins.</footer>
</div>
</body>
</html>
